#Application Configuration
spring:
    application:
       name: user-service

    # H2 Database Configuration
    datasource:
        url: jdbc:h2:mem:testdb
        driver-class-name: org.h2.Driver
        username: sa
        password: pass

    # H2 Console Configuration
    h2:
       console:
            enabled: true
            path: /h2-console

# Server Configuration
server:
    port: 8083




